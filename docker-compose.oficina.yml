# Override para rodar o KusterTech Flow na oficina (máquina interna, 8 GB de RAM dividida com a
# Fábrica e os runners). Ver docs/infra/oficina.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.oficina.yml up -d
#
# - Portas só em 127.0.0.1: portas publicadas pelo Docker passam por cima do ufw, então o bind em
#   0.0.0.0 do compose base exporia o app e o Postgres na rede local. O acesso de fora é só pela
#   Tailscale, com HTTPS do `tailscale serve` apontando para 127.0.0.1:${WEB_PORT}.
# - A imagem vem do registro (ghcr.io), nunca é construída na oficina; quem atualiza é
#   scripts/infra/atualizar-flow.sh, passando FLOW_IMAGEM=<repo>@<digest>.
# - O volume flow_arquivos (arquivos das demandas) vem do compose base em web e worker; a lista
#   de volumes do web aqui se soma à do base (o /oficina não substitui o flow_arquivos).
# - Limite de memória por contêiner, com o heap do Node abaixo do limite para o GC agir antes do OOM.
services:
  postgres:
    ports: !override
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    mem_limit: 512m
    memswap_limit: 768m
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40']

  migrate:
    image: ${FLOW_IMAGEM:-ghcr.io/paulorhyank/kustertech-flow:main}
    build: !reset null
    pull_policy: missing
    mem_limit: 384m
    memswap_limit: 384m

  web:
    image: ${FLOW_IMAGEM:-ghcr.io/paulorhyank/kustertech-flow:main}
    build: !reset null
    pull_policy: missing
    volumes:
      - /var/lib/oficina:/oficina:ro
    ports: !override
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    mem_limit: 768m
    memswap_limit: 1g
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      FLOW_MAQUINA_LOCAL: ${FLOW_MAQUINA_LOCAL:-}
      OFICINA_DIR: /oficina

  worker:
    image: ${FLOW_IMAGEM:-ghcr.io/paulorhyank/kustertech-flow:main}
    build: !reset null
    pull_policy: missing
    mem_limit: 384m
    memswap_limit: 512m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
