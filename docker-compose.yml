name: kustertech-flow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-kustertech_flow}
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kustertech_flow}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: kustertech-flow:local
    build: .
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-kustertech_flow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    image: kustertech-flow:local
    pull_policy: never
    init: true
    command: ['node', 'server.js']
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-kustertech_flow}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # O Decidir lê o PR do fim de fase, responde as decisões da Fábrica e mergeia a partir da
      # web (Server Actions), então a web também conhece a GitHub App (docs/github-app.md).
      GITHUB_FONTE: ${GITHUB_FONTE:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      # Erros do GlitchTip (D81): o worker lê a API; a web mostra a aba Erros. Token só no .env.
      GLITCHTIP_URL: ${GLITCHTIP_URL:-}
      GLITCHTIP_ORG: ${GLITCHTIP_ORG:-}
      GLITCHTIP_TOKEN: ${GLITCHTIP_TOKEN:-}
      GLITCHTIP_PROJETOS: ${GLITCHTIP_PROJETOS:-}
      GLITCHTIP_AMBIENTES: ${GLITCHTIP_AMBIENTES:-}
      GLITCHTIP_LIMIAR_EVENTOS: ${GLITCHTIP_LIMIAR_EVENTOS:-}
      GLITCHTIP_LIMIAR_HORAS: ${GLITCHTIP_LIMIAR_HORAS:-}
      GLITCHTIP_DEMANDAS_POR_DIA: ${GLITCHTIP_DEMANDAS_POR_DIA:-}
      FLOW_BUSCAS_IA_POR_DIA: ${FLOW_BUSCAS_IA_POR_DIA:-}
      FLOW_BUSCAS_IA_TOKENS_DO_LOTE: ${FLOW_BUSCAS_IA_TOKENS_DO_LOTE:-}
      GLITCHTIP_HORAS_SEM_ERRO: ${GLITCHTIP_HORAS_SEM_ERRO:-}
      # Sistemas conectados (D83): a web cifra o token ao salvar e o worker o decifra para buscar.
      FLOW_CHAVE_DOS_SEGREDOS: ${FLOW_CHAVE_DOS_SEGREDOS:-}
      FLOW_ARQUIVOS_DIR: /var/lib/flow/arquivos
    volumes:
      - flow_arquivos:/var/lib/flow/arquivos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: kustertech-flow:local
    pull_policy: never
    init: true
    command: ['node', 'worker.mjs']
    stop_grace_period: 10s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-kustertech_flow}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_FONTE: ${GITHUB_FONTE:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_INTERVALO_MS: ${GITHUB_INTERVALO_MS:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      # Erros do GlitchTip (D81): o worker lê a API; a web mostra a aba Erros. Token só no .env.
      GLITCHTIP_URL: ${GLITCHTIP_URL:-}
      GLITCHTIP_ORG: ${GLITCHTIP_ORG:-}
      GLITCHTIP_TOKEN: ${GLITCHTIP_TOKEN:-}
      GLITCHTIP_PROJETOS: ${GLITCHTIP_PROJETOS:-}
      GLITCHTIP_AMBIENTES: ${GLITCHTIP_AMBIENTES:-}
      GLITCHTIP_LIMIAR_EVENTOS: ${GLITCHTIP_LIMIAR_EVENTOS:-}
      GLITCHTIP_LIMIAR_HORAS: ${GLITCHTIP_LIMIAR_HORAS:-}
      GLITCHTIP_DEMANDAS_POR_DIA: ${GLITCHTIP_DEMANDAS_POR_DIA:-}
      GLITCHTIP_HORAS_SEM_ERRO: ${GLITCHTIP_HORAS_SEM_ERRO:-}
      # Sistemas conectados (D83): a web cifra o token ao salvar e o worker o decifra para buscar.
      FLOW_CHAVE_DOS_SEGREDOS: ${FLOW_CHAVE_DOS_SEGREDOS:-}
      FLOW_ARQUIVOS_DIR: /var/lib/flow/arquivos
    volumes:
      - flow_arquivos:/var/lib/flow/arquivos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  # Arquivos das demandas (anexos, desenhos, capturas); scripts/infra/backup-oficina.sh os envia
  # ao backup externo junto do dump do Postgres.
  flow_arquivos:
