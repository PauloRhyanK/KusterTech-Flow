<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fábrica · escritório detalhado (rascunho v6)</title>
<style>
:root{--fundo:#f4f1ea;--linha:#e4ded2;--txt:#1d2433;--txt2:#6a6f7c;--azul:#2f6fe4;--verde:#1f9d6b;--amar:#e8a317;--verm:#d9483b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--fundo);color:var(--txt)}
.pag{max-width:1440px;margin:0 auto;padding:18px 22px 50px}
h1{font-size:18px;margin:0 0 12px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cont{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha);background:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.cont b{font-size:14px}.cont i{width:9px;height:9px;border-radius:50%}
.cont.on{border-color:var(--azul);box-shadow:0 0 0 3px #2f6fe422}
.sep{flex:1}
.btn{border:0;background:var(--azul);color:#fff;border-radius:10px;padding:8px 13px;font:600 12px Inter,system-ui;cursor:pointer;box-shadow:0 2px 0 #1d4aa3}
.btn.sec{background:#fff;color:var(--txt);border:1px solid var(--linha);box-shadow:none}
.cena{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
/* ---------------- mapa ---------------- */
.mapa{flex:none;position:relative;width:1064px;height:624px;border-radius:18px;overflow:hidden;border:12px solid #4b3a2c;box-shadow:0 14px 34px #3b2a1a45;
 background:#d6b689;background-image:repeating-linear-gradient(0deg,#cba979 0 2px,transparent 2px 26px),repeating-linear-gradient(90deg,transparent 0 78px,#c4a272 78px 80px)}
.mapa *{image-rendering:pixelated}
.parede{position:absolute;left:0;right:0;top:0;height:58px;background:#efe3cf;background-image:repeating-linear-gradient(90deg,transparent 0 30px,#00000008 30px 32px);border-bottom:9px solid #7a5536;z-index:1}
.rodape{position:absolute;left:0;right:0;top:58px;height:4px;background:#5a3f28;z-index:1}
.janela{position:absolute;top:9px;width:118px;height:36px;border:4px solid #7a5536;border-radius:3px;overflow:hidden;background:linear-gradient(#8fc9f2,#cfe9fb);z-index:2}
.janela::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#7a5536}
.nuvem{position:absolute;top:8px;width:26px;height:8px;background:#fff;border-radius:4px;box-shadow:8px -4px 0 -1px #fff;animation:nuvem 38s linear infinite}
@keyframes nuvem{from{left:-40px}to{left:130px}}
.relogio{position:absolute;top:10px;width:30px;height:30px;border-radius:50%;background:#fffaf0;border:4px solid #4b3a2c;z-index:2}
.relogio i{position:absolute;left:50%;top:50%;width:2px;height:9px;margin-left:-1px;background:#232733;transform-origin:50% 0;transform:rotate(180deg)}
.relogio i.min{height:11px;animation:gira 60s linear infinite}@keyframes gira{from{transform:rotate(180deg)}to{transform:rotate(540deg)}}
.zona{position:absolute;border-radius:14px;border:3px solid #00000014}
.zona .rot{position:absolute;top:-11px;left:12px;font:700 10px/1 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;background:#2b2f3a;color:#ffe9a8;padding:5px 9px;border-radius:5px;box-shadow:0 3px 0 #15171d;white-space:nowrap;z-index:900}
.tapete{position:absolute;border-radius:50%;opacity:.55}
.obj{position:absolute;transform:translate(-50%,-100%)}
/* mesa */
.mesa{position:absolute;width:104px;height:46px;transform:translate(-50%,0)}
.mesa .tampo{position:absolute;left:0;right:0;top:0;height:11px;background:#c08a58;border:3px solid #4b3220;border-radius:3px}
.mesa .frente{position:absolute;left:4px;right:4px;top:11px;height:30px;background:#9a6a3f;border:3px solid #4b3220;border-top:0}
.mesa .frente::before{content:"";position:absolute;right:8px;top:6px;width:26px;height:7px;border:2px solid #4b3220;background:#a8784b}
.mesa .frente::after{content:"";position:absolute;right:8px;top:16px;width:26px;height:7px;border:2px solid #4b3220;background:#a8784b}
.mesa .monitor{position:absolute;left:5px;bottom:100%;width:42px;height:30px;background:#2b2f3a;border:3px solid #1b1e26;border-radius:3px;margin-bottom:-3px}
.mesa .monitor::after{content:"";position:absolute;left:50%;bottom:-8px;width:8px;height:6px;margin-left:-4px;background:#1b1e26}
.mesa .tela{position:absolute;inset:2px;background:#1e2430;overflow:hidden;transition:background .4s}
.mesa .tela i{position:absolute;left:3px;height:2px;opacity:0}
.mesa.acesa .tela{background:#10243e;box-shadow:0 0 16px #8fd3ffaa}
.mesa.acesa .tela i{opacity:1;animation:linha 1.6s steps(4) infinite}
.mesa .tela i:nth-child(1){top:3px;background:#7cc4ff;width:18px}.mesa .tela i:nth-child(2){top:8px;background:#9be38f;width:12px;left:7px;animation-delay:.4s!important}
.mesa .tela i:nth-child(3){top:13px;background:#ffd27c;width:20px;animation-delay:.8s!important}.mesa .tela i:nth-child(4){top:18px;background:#7cc4ff;width:9px;left:7px;animation-delay:1.2s!important}
@keyframes linha{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
.mesa.falha .tela{background:#5a1010;box-shadow:0 0 18px #ff5a4acc;animation:alarme .6s steps(2) infinite}
.mesa.falha .tela i{display:none}
.mesa.falha .tela::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;color:#ffd0c8;font:900 16px "Courier New"}
@keyframes alarme{50%{background:#8a1a1a}}
.mesa .teclado{position:absolute;left:52px;top:-4px;width:26px;height:6px;background:#d9dde5;border:2px solid #4b5161;border-radius:2px}
.mesa .caneca{position:absolute;right:6px;top:-9px;width:9px;height:10px;background:#f4efe4;border:2px solid #4b3220;border-radius:0 0 3px 3px}
.mesa.acesa .caneca::before{content:"";position:absolute;left:1px;top:-9px;width:2px;height:6px;background:#ffffffaa;animation:vapor 1.6s infinite}
@keyframes vapor{0%{transform:translateY(3px);opacity:0}50%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
.cadeira{position:absolute;width:40px;height:40px;transform:translate(-50%,0);background:#4f5d78;border:4px solid #2b2f3a;border-radius:10px 10px 4px 4px;transition:transform .5s}
.cadeira::after{content:"";position:absolute;left:6px;right:6px;top:6px;height:12px;border-radius:5px;background:#6a7a98}
.cadeira.vazia{transform:translate(-50%,0) translate(16px,6px) rotate(14deg)}
/* agentes */
.ag{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:left 1.8s ease-in-out,top 1.8s ease-in-out,opacity .3s}
.rota{position:relative}
.corpo{position:relative}
.ag svg{display:block;filter:drop-shadow(0 3px 0 #0000002e)}
.ag.trabalhando .corpo{animation:dig .34s steps(1) infinite}@keyframes dig{50%{transform:translateY(-1px)}}
.ag.anda .corpo{animation:passo .26s steps(2) infinite!important}@keyframes passo{50%{transform:translateY(-4px) rotate(3deg)}}
.ag.comemorando .corpo{animation:pula .42s ease-in-out 5}@keyframes pula{50%{transform:translateY(-16px)}}
.ag.correndo .corpo{animation:passo .16s steps(2) infinite}
.anel{display:none;position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;border:3px solid var(--azul);animation:anel 1.2s infinite;pointer-events:none}
.ag.sel .anel,.ag.realce .anel{display:block}@keyframes anel{50%{transform:scale(1.1);opacity:.45}}
/* hobbies: o movimento acontece dentro da área de cada um */
.h-xadrez .rota{animation:xadrez 9s ease-in-out infinite}
@keyframes xadrez{0%,38%{transform:translateX(0)}48%,88%{transform:translateX(86px) scaleX(-1)}98%,100%{transform:translateX(0)}}
.h-xadrez .corpo{animation:respira 2.4s ease-in-out infinite}
.h-pintar .rota{animation:pintar 6s ease-in-out infinite}
@keyframes pintar{0%,45%{transform:translateX(0)}55%,75%{transform:translateX(-20px)}85%,100%{transform:translateX(0)}}
.h-pintar .corpo{animation:pincel .5s steps(2) infinite}@keyframes pincel{50%{transform:translateY(-2px) rotate(-3deg)}}
.h-musica .rota{animation:danca 1.6s ease-in-out infinite}
@keyframes danca{0%,100%{transform:translateX(-6px) rotate(-7deg)}50%{transform:translateX(6px) rotate(7deg)}}
.h-musica .corpo{animation:quica .4s ease-in-out infinite}@keyframes quica{50%{transform:translateY(-5px)}}
.h-cafe .rota{animation:cafe 10s ease-in-out infinite}
@keyframes cafe{0%,12%{transform:translate(0,0)}30%,60%{transform:translate(48px,-112px)}78%,100%{transform:translate(0,0)}}
.h-cafe .corpo{animation:respira 2.4s ease-in-out infinite}
.h-ler .corpo{animation:respira 3.2s ease-in-out infinite}
.h-fliper .corpo{animation:joga .22s steps(2) infinite}@keyframes joga{50%{transform:translateX(2px)}}
@keyframes respira{50%{transform:translateY(-2px)}}
.mao{position:absolute;pointer-events:none}
.livro{left:14px;top:34px;width:22px;height:14px;background:#d9483b;border:2px solid #232733;border-radius:2px}
.livro::after{content:"";position:absolute;left:50%;top:-1px;width:9px;height:12px;background:#fbf7ef;border:1px solid #232733;transform-origin:0 50%;animation:pagina 3.4s steps(6) infinite}
@keyframes pagina{0%,70%{transform:scaleX(1)}85%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
.xicara{left:40px;top:38px;width:10px;height:10px;background:#f4efe4;border:2px solid #232733;border-radius:0 0 3px 3px;opacity:0;animation:xic 10s infinite}
@keyframes xic{0%,55%{opacity:0}60%,100%{opacity:1}}
.notas{position:absolute;left:44px;top:-6px;pointer-events:none}
.notas b{position:absolute;width:6px;height:6px;background:#2fa3e6;border-radius:50%;box-shadow:4px -8px 0 -2px #2fa3e6;opacity:0;animation:nota 2s infinite}
.notas b:nth-child(2){left:-48px;animation-delay:.7s;background:#e86aa0;box-shadow:4px -8px 0 -2px #e86aa0}.notas b:nth-child(3){left:-14px;animation-delay:1.3s;background:#e8b730;box-shadow:4px -8px 0 -2px #e8b730}
@keyframes nota{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-26px);opacity:0}}
.peca{position:absolute;width:6px;height:9px;background:#1d1d22;border-radius:3px 3px 1px 1px;animation:peca 9s infinite}
@keyframes peca{0%,30%{transform:translate(0,0)}34%{transform:translate(4px,-8px)}38%,80%{transform:translate(9px,3px)}84%{transform:translate(4px,-8px)}88%,100%{transform:translate(0,0)}}
.tinta{position:absolute;height:5px;animation:tinta 6s steps(6) infinite}
@keyframes tinta{0%{width:0}60%,100%{width:var(--w)}}
.fliper-tela{position:absolute;animation:pisca .45s steps(2) infinite}@keyframes pisca{50%{filter:brightness(1.6) hue-rotate(60deg)}}
.disco{position:absolute;border-radius:50%;background:radial-gradient(circle,#e86aa0 0 3px,#1d1d22 3px 100%);border:2px solid #000;animation:gira2 1.2s linear infinite}@keyframes gira2{to{transform:rotate(360deg)}}
.led{position:absolute;width:4px;height:4px;animation:led .8s steps(2) infinite}@keyframes led{50%{opacity:.2}}
.gato{animation:gato 3s ease-in-out infinite;transform-origin:50% 100%}@keyframes gato{50%{transform:translate(-50%,-100%) scaleY(.9)}}
.balcao-vapor{position:absolute;width:3px;height:8px;background:#ffffffbb;animation:vapor 1.4s infinite}
/* topo: balões e plaquinhas sempre por cima */
.topo{position:absolute;inset:0;z-index:950;pointer-events:none}
.bal{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid #232733;border-radius:9px;padding:4px 8px;font:600 10px/13px Inter,system-ui;width:max-content;max-width:150px;text-align:center;box-shadow:2px 2px 0 #232733;transition:left 1.8s ease-in-out,top 1.8s ease-in-out}
.bal::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#232733}
.bal.parado{background:#fdf1d8;border-color:#8a5a00;color:#6b4300;box-shadow:2px 2px 0 #8a5a00}.bal.parado::after{border-top-color:#8a5a00}
.bal.falha{background:#ffe3df;border-color:#a8342a;color:#8a1f16;box-shadow:2px 2px 0 #a8342a}.bal.falha::after{border-top-color:#a8342a}
.bal.placa{background:#ffe9a8;border-color:#6b4300;border-radius:4px;color:#6b4300;box-shadow:2px 2px 0 #6b4300}.bal.placa::after{border-top-color:#6b4300}
.bal.ok{background:#dff5ea;border-color:#167a52;color:#167a52;box-shadow:2px 2px 0 #167a52;font-size:13px;padding:2px 7px}.bal.ok::after{border-top-color:#167a52}
.confete{position:absolute;pointer-events:none}
.confete b{position:absolute;width:5px;height:5px;animation:confete 1.5s ease-out forwards}
@keyframes confete{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.esmaece{opacity:.25!important}
/* ficha e plano */
.lado{flex:1 1 300px;max-width:400px;display:flex;flex-direction:column;gap:14px}
.ficha,.plano{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px}
.ficha .cab{display:flex;gap:12px;align-items:center}
.ficha .av{width:76px;height:86px;border-radius:14px;background:#f4ead8;display:grid;place-items:center;flex:none}
.ficha h3{margin:0;font-size:16px}.ficha .papel{font-size:12px;color:var(--txt2);margin-top:2px}
.estado{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.estado i{width:7px;height:7px;border-radius:50%}
.bloco{margin-top:14px;font-size:12px;line-height:18px}
.bloco .t{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin-bottom:4px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--fundo);border-radius:10px;padding:8px;font-size:11px;color:var(--txt2)}.nums b{display:block;font-size:15px;color:var(--txt)}
.linkzinho{color:var(--azul);font-weight:600;font-size:12px;margin-top:12px;display:inline-block;text-decoration:none}
.plano h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2)}
.parte{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;border:1px solid transparent;cursor:default;font-size:12px}
.parte .mini{width:28px;height:32px;border-radius:7px;background:#f4ead8;display:grid;place-items:center;flex:none}
.parte .s{margin-left:auto;width:10px;height:10px;border-radius:50%}
.parte.realce{border-color:var(--azul);background:#f2f7ff;box-shadow:0 0 0 3px #2f6fe41c}
</style></head><body><div class="pag">

</div>

function pos(id,e){const a=AG[id];
 if(id==='fix'){if(e[0]==='fora')return ENTRADA;return[800,418]}
 if(['trabalhando','parado','comemorando'].includes(e[0]))return[a.mesa[0]+20,a.mesa[1]-16];
 if(e[0]==='falha')return[a.mesa[0]-10,a.mesa[1]+82];
 if(e[0]==='chama')return PORTA;

function grupo(e){if(['trabalhando','parado','comemorando','falha','correndo'].includes(e))return'trabalhando';if(e==='chama')return'chama';if(e==='fora')return null;return'livre'}

function render(){
 const P=L[passo];const n={trabalhando:0,livre:0,chama:0};
 for(const[id,a]of Object.entries(AG)){
  const e=P[id],o=E[id],[x,y]=pos(id,e),g=grupo(e[0]);if(g)n[g]++;
  if(o.mesa){o.mesa.classList.toggle('acesa',['trabalhando','parado'].includes(e[0]));o.mesa.classList.toggle('falha',e[0]==='falha');
   o.cad.classList.toggle('vazia',!['trabalhando','parado','comemorando'].includes(e[0]))}
  const mudou=o.ag.style.left&&(o.ag.style.left!==x+'px'||o.ag.style.top!==y+'px');
  const livre=e[0]==='livre';
  o.ag.className=`ag ${e[0]}${livre?' '+a.classe:''}${sel===id?' sel':''}${mudou&&e[0]!=='correndo'?' anda':''}`;
  if(mudou)setTimeout(()=>o.ag.classList.remove('anda'),1800);
  o.ag.style.left=x+'px';o.ag.style.top=y+'px';
  const sentado=['trabalhando','parado','comemorando'].includes(e[0])&&o.mesa;
  o.ag.style.zIndex=sentado?a.mesa[1]+20:(id==='rui'&&livre?540:y+40);
  o.ag.style.opacity=e[0]==='fora'?0:1;
  o.ag.querySelector('.extra').innerHTML=livre?EXTRA[GENTE[id].hobby]:'';
  // balões só para ações
  let b=null,cls='';
  if(e[0]==='trabalhando'){b=e[1]}
  if(e[0]==='parado'){b=e[1];cls='parado'}
  if(e[0]==='falha'){b=e[1];cls='falha'}
  if(e[0]==='chama'){b='✋ '+e[1];cls='placa'}
  if(e[0]==='comemorando'){b='✓';cls='ok'}
  o.bal.className='bal '+cls;o.bal.style.display=b?'block':'none';o.bal.textContent=b||'';
  o.bal.style.left=x+'px';o.bal.style.top=(y-(sentado?40:38))+'px';
  if(e[0]==='comemorando'){const c=document.createElement('div');c.className='confete';c.style.cssText=`left:${x}px;top:${y-20}px`;c.innerHTML=Array.from({length:18},(_,i)=>`<b style="--dx:${Math.cos(i/18*6.28)*46}px;--dy:${Math.sin(i/18*6.28)*36-24}px;background:${['#e8b730','#2fa3e6','#e86aa0','#1f9d6b'][i%4]}"></b>`).join('');topo.appendChild(c);setTimeout(()=>c.remove(),1600)}
  const esm=filtro&&g!==filtro;[o.ag,o.mesa,o.cad].forEach(q=>q&&q.classList.toggle('esmaece',!!esm));o.bal.classList.toggle('esmaece',!!esm);
 }
 // o Fix chega correndo pela porta da esquerda e some depois de consertar
 if(P.fix[0]==='comemorando')setTimeout(()=>{if(L[passo].fix[0]==='comemorando'){const o=E.fix;o.ag.style.left=ENTRADA[0]+'px';o.ag.style.top=ENTRADA[1]+'px';o.ag.classList.add('anda');o.bal.style.display='none';setTimeout(()=>o.ag.style.opacity=0,1700)}},2200);
 document.getElementById('n-trab').textContent=n.trabalhando;document.getElementById('n-liv').textContent=n.livre;document.getElementById('n-cha').textContent=n.chama;
 document.querySelectorAll('.cont').forEach(c=>c.classList.toggle('on',c.dataset.f===filtro));
 plano();ficha();}

function realcar(id,on){E[id]?.ag.classList.toggle('realce',on);document.querySelectorAll('.parte').forEach(p=>p.classList.toggle('realce',on&&p.dataset.id===id))}
function plano(){const P=L[passo].partes;const cor={ok:'#1f9d6b',exe:'#2f6fe4',est:'#d8d2c4',falha:'#d9483b'};
 document.getElementById('plano').innerHTML=PARTES.map(([id,t])=>`<div class="parte" data-id="${id}"><div class="mini">${boneco(id,1.3)}</div><span>${t}</span><i class="s" style="background:${cor[P[id]]}"></i></div>`).join('');
 document.querySelectorAll('.parte').forEach(p=>{p.onmouseenter=()=>realcar(p.dataset.id,true);p.onmouseleave=()=>realcar(p.dataset.id,false);p.onclick=()=>{sel=p.dataset.id;render()}})}
function ficha(){const g=GENTE[sel],e=L[passo][sel];
 const hoje={otto:['1','52 min','US$ 0,41','—'],duda:['1','1h 10','US$ 0,63','—'],fe:['1','2h 05','US$ 1,92','Filtros da lista'],beto:['1','1h 31','US$ 1,20','API de busca'],rui:['0','12 min','US$ 0,18','PR da Fê'],quinn:['0','20 min','US$ 0,22','Testar a busca'],fix:['1','4 min','US$ 0,09','—']}[sel];
 const est={trabalhando:['#e6efff','#1f4fb0','var(--azul)',`${e[1]} · ${e[2]} min`],parado:['#fdf1d8','#8a5a00','var(--amar)',e[1]],falha:['#ffe3df','#8a1f16','var(--verm)',e[1]],chama:['#ffe9a8','#6b4300','var(--verm)','precisa de você: '+e[1]],comemorando:['#dff5ea','#167a52','var(--verde)','acabou de entregar'],correndo:['#ffe3df','#8a1f16','var(--verm)','indo consertar'],fora:['#eceae4','#6a6f7c','#9aa3b2','fora do andar'],livre:['#eef6f1','#3d6b55','#8cc5a8',g.faz]}[e[0]];
 document.getElementById('ficha').innerHTML=`<div class="cab"><div class="av">${boneco(sel,3)}</div><div><h3>${g.nome}</h3><div class="papel">${g.titulo}</div><span class="estado" style="background:${est[0]};color:${est[1]}"><i style="background:${est[2]}"></i>${est[3]}</span></div></div>
 <div class="bloco"><div class="t">Hoje nesta demanda</div><div class="nums"><div><b>${hoje[0]}</b>entregues</div><div><b>${hoje[1]}</b>trabalhando</div><div><b>${hoje[2]}</b>custo</div></div></div>
 <div class="bloco"><div class="t">Próxima parte</div>${hoje[3]}</div>
 <a class="linkzinho" href="#">Abrir a tela do agente ›</a>`}
document.getElementById('prox').onclick=()=>{passo=(passo+1)%L.length;render()};
document.getElementById('reini').onclick=()=>{passo=0;render()};
document.querySelectorAll('.cont').forEach(c=>c.onclick=()=>{filtro=filtro===c.dataset.f?null:c.dataset.f;render()});
render();
</script></body></html>
