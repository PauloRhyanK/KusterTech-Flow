name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kustertech_flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kustertech_flow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kustertech_flow_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/kustertech_flow_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm db:generate

      - name: Verificar formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração
        run: pnpm test:integration

      - name: Build de produção
        run: pnpm build

      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kustertech_flow_test
        run: pnpm e2e

      - name: Publicar capturas E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: e2e/capturas/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build .
